name: Run Hello Script

on:
  workflow_dispatch:

jobs:
  run-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run hello.py
        run: python3 hello.py

      - name: Check public IP
        run: curl -s ifconfig.io

      - name: Sleep 60 seconds
        run: sleep 60
